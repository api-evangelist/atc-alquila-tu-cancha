aid: atc-alquila-tu-cancha
name: ATC (Alquila tu cancha)
description: ATC (Alquila Tu Cancha) is an Argentine sports-technology company, founded in 2020, that
  operates LATAM's leading platform for booking amateur sports venues — courts for football, padel,
  tennis and more — alongside cloud management software for the clubs and complexes that run them.
  Consumers search real-time availability by location, sport and time and reserve in a few steps through
  the ATC Sports mobile apps and web app, with online payments guaranteed via Mercado Pago. Clubs use
  the ATC management software to handle online reservations, cash control, reporting and service sales.
  ATC operates across eight-plus countries including Argentina, Peru, Chile, Uruguay, Panama, Mexico,
  Colombia, Costa Rica and the United States, spanning 500-plus venues and more than 200,000 active
  players. The company is a 500 Global (500 Latam) portfolio company. It exposes no public developer
  API, SDK or developer portal at this time; this profile tracks its public web presence.
